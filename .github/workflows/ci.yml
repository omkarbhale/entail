name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux (WSL included), macOS and native Windows are the supported platforms.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The Task Scheduler service on a real Windows: installed and started, running
      # entail (hidden) and its board, seen by status, then stopped and removed.
      - name: service (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node dist/cli.js service install
          for attempt in $(seq 30); do node dist/cli.js service status && break; sleep 2; done
          node dist/cli.js service status
          curl -fsS http://127.0.0.1:4380/api/status
          node dist/cli.js status
          node dist/cli.js service uninstall
          node dist/cli.js service status | grep "not installed"
          for attempt in $(seq 15); do node dist/cli.js status | grep -q "entail is not running" && break; sleep 2; done
          node dist/cli.js status | grep "entail is not running"
